name: Marcar entrada Jibble

on:
  schedule:
    # Lunes a viernes, 8:30 a. m. de Perú
    - cron: "30 13 * * 1-5"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jibble-entrada
  cancel-in-progress: false

jobs:
  marcar-entrada:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Ejecutar API de entrada
        run: |
          status_code="$(curl \
            --silent \
            --show-error \
            --location \
            --request POST \
            --connect-timeout 60 \
            --max-time 480 \
            --output /tmp/entrada-response.json \
            --write-out "%{http_code}" \
            "https://asistencia-jible.onrender.com/api/asistencia/entrada")"

          cat /tmp/entrada-response.json || true

          if [ "$status_code" = "200" ] || [ "$status_code" = "409" ]; then
            echo "Solicitud completada con código $status_code"
            exit 0
          fi

          echo "La solicitud falló con código HTTP $status_code"
          exit 1
