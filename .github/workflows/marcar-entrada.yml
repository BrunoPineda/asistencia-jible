name: Marcar entrada Jibble

on:
  schedule:
    # 13:30 UTC = 08:30 a. m. en Perú
    # Se ejecuta de lunes a viernes
    - cron: "30 13 * * 1-5"

  # Permite probarlo manualmente desde GitHub
  workflow_dispatch:

jobs:
  marcar-entrada:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Ejecutar API de entrada
        run: |
          curl --fail \
            --show-error \
            --location \
            --request POST \
            --retry 3 \
            --retry-delay 15 \
            --retry-all-errors \
            --connect-timeout 60 \
            --max-time 480 \
            "https://asistencia-jible.onrender.com/api/asistencia/entrada"