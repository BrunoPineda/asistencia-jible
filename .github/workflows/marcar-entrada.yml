name: Marcar entrada Jibble

on:
  schedule:
    # 13:25 UTC = 08:25 a. m. en Perú
    # Lunes a viernes
    - cron: "25 13 * * 1-5"

  workflow_dispatch:

jobs:
  marcar-entrada:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Ejecutar API de entrada
        run: |
          curl --fail \
            --show-error \
            --location \
            --request POST \
            --connect-timeout 60 \
            --max-time 480 \
            "https://asistencia-jible.onrender.com/api/asistencia/entrada"
