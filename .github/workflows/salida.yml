name: Marcar salida Jibble

on:
  schedule:
    # Lunes a viernes, 6:30 p. m. de Perú (23:30 UTC)
    - cron: "30 23 * * 1-5"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jibble-salida
  cancel-in-progress: false

jobs:
  marcar-salida:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar marcación de salida
        run: npm run salida
        env:
          JIBBLE_EMAIL: ${{ secrets.JIBBLE_EMAIL }}
          JIBBLE_PASSWORD: ${{ secrets.JIBBLE_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DEVELOPER: "true"
          BROWSER_HEADLESS: "true"

      - name: Notificar error en Telegram
        if: failure() && secrets.TELEGRAM_BOT_TOKEN != '' && secrets.TELEGRAM_CHAT_ID != ''
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -H "Content-Type: application/json" \
            -d '{"chat_id": "${{ secrets.TELEGRAM_CHAT_ID }}", "text": "❌ <b>GitHub Action Jibble:</b> Falló la ejecución de la marcación de salida.", "parse_mode": "HTML"}'
